name: Deploy to Railway

# PARKED for Operator Suite launch. Manual trigger only.
# Auto-deploy on push was failing (no RAILWAY_TOKEN) and adding noise.
# GiantBite is not the product we are launching this month.

on:
  workflow_dispatch: {}

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set — GiantBite is parked. Do not run this during Operator Suite launch."
            exit 1
          fi
          railway up --detach --ci
